name: MNIST_CICD

on:
    push:
        branches:
            - main

jobs:    
    build-and-publish:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v3

            -   name: Setup Docker Buildx
                uses: docker/setup-buildx-action@v2

            -   name: Login to DockerHub
                uses: docker/login-action@v2
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            -   name: Build and push Docker image
                uses: docker/build-push-action@v4
                with:
                    context: .
                    file: ./Dockerfile
                    push: true
                    tags: ${{ secrets.DOCKER_USERNAME }}/mnist-app:latest

            -   name: Image digest
                run: echo ${{ steps.build-and-publish.outputs.digest }}

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-publish

        steps:
            -   name: SSH into EC2 and redeploy
                uses: appleboy/ssh-action@v1.0.3
                with:
                    host:     ${{ secrets.EC2_HOST }}
                    username: ubuntu
                    key:      ${{ secrets.EC2_SSH_KEY }}
                    script: |
                        docker pull ${{ secrets.DOCKER_USERNAME }}/mnist-app:latest
                        docker stop mnist-app || true
                        docker rm   mnist-app || true
                        docker run -d \
                            --name mnist-app \
                            --restart unless-stopped \
                            -p 5000:5000 \
                            ${{ secrets.DOCKER_USERNAME }}/mnist-app:latest